# Real money. `tbot live config/live.yaml --live` is required to start it.
# The bot manages initial_cash (in USDT) and what it buys with it. Other balances in the
# account, including BTC or ETH bought by hand, are left alone (ownership: budget).
# Start small: initial_cash is the most the bot can lose. Keep at least that much free USDT.
mode: live
ownership: budget
initial_cash: 1000
costs:
  fee_rate: 0.001
  slippage_bps: 5
risk:
  max_symbol_weight: 0.5
  max_gross_exposure: 1.0
  target_volatility: 0.4
  volatility_lookback_days: 30
rebalance:
  min_notional: 10
  rebalance_threshold: 0.02
guard:
  daily_loss_limit: 0.03   # reduce-only for the rest of a bad day; no 2018-2026 fill changes
  # The kill switch stops a broken strategy, not a normal drawdown. Monte Carlo of this
  # strategy's daily returns goes past 45% in 5% of in-sample paths and in 16% of 4-year
  # out-of-sample paths (55%: 0.6% and 4.5%). At 0.15 the backtest halts in Nov 2018 for good.
  max_drawdown: 0.45
  stale_seconds: 900
strategies:
  - name: donchian_trend
    symbols: [BTC/USDT, ETH/USDT]
    timeframe: 4h
    allocation: 1.0
    params: {entry: 55, exit: 20}
ledger: data/live.sqlite
protective_stop_pct: 0.2
reconcile_seconds: 300
reconcile_tolerance: 0.002
recv_window: 5000
heartbeat_seconds: 300
stale_after_seconds: 600
batch_wait_seconds: 5
summary_hour_utc: 0
backup_days: 14           # daily copies of the ledger in data/backups
telegram_commands: false  # true for the session you watch, false in the others
