# Example of two strategies running together: 4h trend following and 1h mean reversion.
# Run `tbot backtest config/multi.yaml --attribution` to see each alone and the combination.
# Not a recommendation: on 2018-2026 data the RSI leg loses money alone and lowers the mix's
# Sharpe below Donchian alone (see docs/reports). It shows the machinery, not an edge.
start: 2018-01-01
initial_cash: 10000
costs:
  fee_rate: 0.001
  slippage_bps: 5
risk:
  max_symbol_weight: 1.0
  max_gross_exposure: 1.0
  target_volatility: 0.4
  volatility_lookback_days: 30
rebalance:
  min_notional: 10
  rebalance_threshold: 0.02
strategies:
  - name: donchian_trend
    symbols: [BTC/USDT, ETH/USDT]
    timeframe: 4h
    allocation: 0.6
    params: {entry: 55, exit: 20}
  - name: rsi_reversion
    symbols: [BTC/USDT, ETH/USDT]
    timeframe: 1h
    allocation: 0.4
    params: {period: 14, low: 30, high: 70, trend_period: 200}
