# Same plan as donchian_voltarget_validation.yaml, except that walk-forward picks the grid
# point whose neighbors do best on average instead of the single best point. This rule was
# proposed in docs/reports/donchian_voltarget_2026-09-29.md before its effect was measured.
backtest: donchian_voltarget.yaml
holdout_start: 2025-01-01
grid:
  entry: [20, 30, 40, 55, 70, 90]
  exit: [10, 15, 20, 30, 40]
objective: sharpe
min_trades: 30
selection: neighborhood
walk_forward: {train_months: 36, test_months: 12}
monte_carlo: {runs: 2000, seed: 1}
cost_multiplier: 2.0
gate: {min_oos_sharpe: 0.8, max_drawdown: 0.25, min_trades: 100}
