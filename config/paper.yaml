# Paper trading: Donchian trend on BTC and ETH 4h bars, simulated fills at live prices.
initial_cash: 10000
costs:
  fee_rate: 0.001     # Binance spot taker, VIP 0
  slippage_bps: 5
risk:
  max_symbol_weight: 0.5
  max_gross_exposure: 1.0
rebalance:
  min_notional: 10
  rebalance_threshold: 0.02
strategies:
  - name: donchian_trend
    symbols: [BTC/USDT, ETH/USDT]
    timeframe: 4h
    allocation: 1.0
    params: {entry: 55, exit: 20}
ledger: data/paper.sqlite
heartbeat_seconds: 300
stale_after_seconds: 600
batch_wait_seconds: 5
summary_hour_utc: 0
