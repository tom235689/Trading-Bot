# Donchian trend following on BTC and ETH 4h bars.
start: 2018-01-01
initial_cash: 10000
costs:
  fee_rate: 0.001     # Binance spot taker, VIP 0
  slippage_bps: 5
risk:
  max_symbol_weight: 1.0
  max_gross_exposure: 1.0
rebalance:
  min_notional: 10
  rebalance_threshold: 0.02
strategies:
  - name: donchian_trend
    symbols: [BTC/USDT, ETH/USDT]
    timeframe: 4h
    allocation: 1.0
    params: {entry: 55, exit: 20}
