# Lint, types, and tests on every push and pull request; weekly against the newest packages.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # Mondays: does the code still work with the newest dependencies?
  workflow_dispatch:

permissions:
  contents: read

concurrency:  # a newer push replaces a running check; weekly runs and pushes never cancel each other
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the git guard scans the whole history
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run --frozen python scripts/git_guard.py audit
      - run: uv run --frozen python -m ruff check .
      - run: uv run --frozen python -m ruff format --check .
      - run: uv run --frozen python -m mypy
      - name: pytest
        shell: bash
        run: |
          status=0
          uv run --frozen python -m pytest -q -rfE > pytest.log 2>&1 || status=$?
          cat pytest.log
          # Failed tests as annotations: they show on the commit page without the log.
          grep -E '^(FAILED|ERROR) ' pytest.log | cut -c1-400 | sed 's/^/::error::/' || true
          exit $status
      - if: matrix.os == 'ubuntu-latest'
        run: uv build

  release:
    name: release
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # to create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: tag, version, and changelog agree
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -qx "version = \"$version\"" pyproject.toml; then
            echo "::error::pyproject.toml is not at $version"; exit 1
          fi
          awk -v head="## $version " 'index($0, head) == 1 {on = 1; next} /^## / {on = 0} on' \
            CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version"; exit 1
          fi
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" --verify-tag
          --title "tbot ${GITHUB_REF_NAME#v}" --notes-file notes.md

  newest:
    name: newest dependencies
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      - run: uv lock --upgrade
      - run: uv sync --locked --group dev
      - run: uv run --locked python -m mypy
      - name: pytest
        run: |
          status=0
          uv run --locked python -m pytest -q -rfE > pytest.log 2>&1 || status=$?
          cat pytest.log
          grep -E '^(FAILED|ERROR) ' pytest.log | cut -c1-400 | sed 's/^/::error::/' || true
          exit $status
