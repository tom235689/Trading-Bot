# Lint, types, and tests on every push and pull request; weekly against the newest packages.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # Mondays: does the code still work with the newest dependencies?
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the git guard scans the whole history
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen python scripts/git_guard.py audit
      - run: uv run --frozen python -m ruff check .
      - run: uv run --frozen python -m ruff format --check .
      - run: uv run --frozen python -m mypy
      - run: uv run --frozen python -m pytest -q
      - if: matrix.os == 'ubuntu-latest'
        run: uv build

  newest:
    name: newest dependencies
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      - run: uv lock --upgrade
      - run: uv sync --locked
      - run: uv run --locked python -m mypy
      - run: uv run --locked python -m pytest -q
